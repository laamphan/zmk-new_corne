# Eyelash Corne - ZMK Firmware Configuration File
# 
# HOW TO READ THIS FILE:
# - Settings marked "CONFIG_..." are configuration options
# - Uncommented lines (no # prefix) are ACTIVE settings
# - "CURRENT:" indicates the active value
# - "Default:" indicates what ZMK uses if setting is not specified
# 
# TO CUSTOMIZE:
# 1. Find the setting you want to change
# 2. Modify the value (e.g., 160 to 0, y to n)
# 3. Save this file
# 4. Rebuild and flash your firmware
# 5. Reboot keyboard to apply changes
#
# ============================================================================
# SLEEP & POWER MANAGEMENT CONFIGURATION
# ============================================================================
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# Time in milliseconds before keyboard enters sleep mode
# Default: 3600000 (1 hour) if not set
# Range: Any positive integer in milliseconds
# Lower = earlier sleep, more battery life
# Higher = keyboard stays awake longer

CONFIG_ZMK_SLEEP=y
# Enable sleep mode (keyboard goes into low-power state when idle)
# Default: y if not set
# Options: y (enable) or n (disable)



# ============================================================================
# RGB UNDERGLOW CONFIGURATION - WS2812B LED Strip (21 LEDs)
# ============================================================================
# These settings control the addressable RGB LEDs around the keyboard perimeter

CONFIG_WS2812_STRIP=y
# Enable WS2812 LED driver for addressable RGB strip
# Default: y if not set
# Options: y (enable) or n (disable)
# Required: Must be y for any RGB underglow to function

CONFIG_ZMK_RGB_UNDERGLOW=y
# Enable RGB underglow feature (main toggle)
# Default: y if not set
# Options: y (enable) or n (disable)
# Note: Also requires CONFIG_WS2812_STRIP=y

CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Start RGB LEDs on or off when keyboard powers on
# Default: n (off) if not set
# Options: y (turn on at startup) or n (turn off at startup)
# Impact: y = drains battery faster, n = saves battery but LEDs don't show on boot
# CURRENT: n (off) - RGB starts disabled

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Automatically turn off RGB after keyboard becomes idle
# Default: y if not set
# Options: y (auto-off enabled) or n (stay on always)
# Idle timeout: 30 minutes (hardcoded in ZMK)
# Impact: y = major battery savings, n = more power consumption
# CURRENT: y (auto-off enabled)

CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# Starting color when RGB turns on (on color wheel 0-360 degrees)
# Default: 0 (red) if not set
# Range: 0-360 (360 = full color wheel cycle)
# Values:
#   0° = Red          60° = Yellow      120° = Green      180° = Cyan
#   240° = Blue       270° = Purple     300° = Magenta    330° = Rose
# CURRENT: 160 (cyan/turquoise)

CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Starting animation effect when RGB turns on (effect index)
# Default: 0 (solid) if not set
# Range: 0-10+ (depends on ZMK version, adjust to find available effects)
# Available effects:
#   0 = Solid         1 = Breathing     2 = Spectrum      3 = Rainbow
#   4 = Swirl         5 = Swimming      6 = Knight Rider  7 = Layers Blink
#   8 = Alternating   9 = Alt Columns   10+ = version dependent
# CURRENT: 3 (rainbow cycle animation)

# Optional RGB Settings (uncomment to enable and customize):
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
#   Starting saturation (color intensity) when RGB turns on
#   Default: 100 (full color) if not set
#   Range: 0-100 (0 = gray, 100 = full vibrant color)

# CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
#   Starting brightness when RGB turns on
#   Default: 100 (max brightness) if not set
#   Range: 0-100 (0 = off, 100 = maximum brightness)
#   Impact on battery: Each 10% reduction ≈ 10% battery savings

# CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=50
#   Starting animation speed when RGB turns on
#   Default: 50 (medium) if not set
#   Range: 0-100 (0 = slow, 100 = very fast)
#   Only affects animated effects (solid color ignores this)

# CONFIG_ZMK_RGB_UNDERGLOW_SPLIT_SYNC=y
#   Synchronize RGB settings across both keyboard halves (split sync)
#   Default: y if not set
#   Options: y (sync both halves) or n (each half independent)


# ============================================================================
# HID REPORT CONFIGURATION
# ============================================================================

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Enable NKRO (N-Key Rollover) - allows unlimited simultaneous key presses
# Default: n if not set (6-key rollover by default)
# Options: y (enable NKRO) or n (disable, use 6-key rollover)
# CURRENT: y (NKRO enabled - uncommented, active)

# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# Use basic consumer report usage set (for OS compatibility)
# Default: y (basic) if not set
# Options: y (basic, better compatibility) or n (full set)
# CURRENT: Commented out (using default basic set)
# Uncomment if media keys don't work on your OS

#EC11 enable
CONFIG_EC11=y
# Enable EC11 rotary encoder driver
# Default: y if not set
# Options: y (enable) or n (disable)
# CURRENT: y (enabled)

CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# Handle encoder events in global thread instead of local
# Default: y if not set
# Options: y (global thread) or n (local thread)
# Impact: y = more responsive, n = may have latency
# CURRENT: y (global thread)

# ============================================================================
# MOUSE/POINTING CONFIGURATION - Trackball/Pointing Device
# ============================================================================
# Settings for mouse emulation and pointing device control

# Mouse enable
CONFIG_ZMK_POINTING=y
# Enable mouse/pointing support for trackball input
# Default: y if not set
# Options: y (enable mouse) or n (disable mouse)
# CURRENT: y (mouse enabled)

# ============================================================================
# BACKLIGHT CONFIGURATION - PWM White LED (Key illumination)
# ============================================================================
# These settings control the white LED that illuminates the keyboard keys

CONFIG_ZMK_BACKLIGHT=y
# Enable PWM backlight feature (key illumination)
# Default: y if not set
# Options: y (enable) or n (disable)
# CURRENT: y (enabled)

CONFIG_ZMK_BACKLIGHT_BRT_START=100
# Starting brightness for backlight when keyboard powers on
# Default: 100 (max brightness) if not set
# Range: 0-100 (0 = off, 100 = maximum brightness)
# CURRENT: 100 (full brightness)

# Optional Backlight Settings (uncomment to enable and customize):
# CONFIG_ZMK_BACKLIGHT_ON_START=y
#   Start backlight on or off when keyboard powers on
#   Default: y if not set
#   Options: y (on at startup) or n (off at startup)

# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
#   Automatically turn off backlight after keyboard becomes idle
#   Default: y if not set (if feature is enabled)
#   Options: y (auto-off enabled) or n (stay on always)
#   Idle timeout: Same as RGB (30 minutes)

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# Enable smooth scrolling for mouse wheel
# Default: y if not set
# Options: y (smooth scrolling) or n (discrete steps)
# CURRENT: y (smooth scrolling enabled)

# ============================================================================
# BLUETOOTH & WIRELESS CONFIGURATION
# ============================================================================

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Increase Bluetooth transmit power for extended wireless range
# Default: n if not set (standard power)
# Options: y (increased power) or n (standard power)
# Impact: y = slightly better range, n = standard range
# CURRENT: y (increased power enabled)

# ============================================================================
# SWITCH DEBOUNCE CONFIGURATION
# ============================================================================
# Settings for key press/release debouncing

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
# Debounce delay for key press detection (in milliseconds)
# Default: 5 if not set
# Range: 1-100 (lower = faster response, higher = more stable)
# Note: Lower values may cause chatter on lower-quality switches
# 缩小数值减少延迟但对轴体品质要求会更高 (Lower values reduce latency but require better switch quality)
# CURRENT: 8ms (balanced between speed and stability)

CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
# Debounce delay for key release detection (in milliseconds)
# Default: 5 if not set
# Range: 1-100 (lower = faster response, higher = more stable)
# CURRENT: 8ms (matched to press debounce for consistency)

# ============================================================================
# POWER MANAGEMENT CONFIGURATION
# ============================================================================

CONFIG_ZMK_PM_SOFT_OFF=y
# Enable soft-off mode (soft power down that can be woken by key combo)
# Default: n if not set
# Options: y (enable soft-off) or n (disable soft-off)
# Activation: Hold multiple specific keys (usually keys 1, 15, 29)
# Impact: y = true power-down, n = only sleep mode available
# CURRENT: y (soft-off enabled)

